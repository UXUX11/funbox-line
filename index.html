  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f4f6f9; }

    <!-- 標題與說明 -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800 tracking-wide mb-2">LINE 門市帳號一鍵快速加好友</h1>
      <p class="text-sm text-gray-500">點擊右側按鈕會直接開啟 LINE App 彈出加好友視窗（已點過的按鈕會自動變成灰色標記）</p>
    </div>

    <!-- 地區篩選按鈕列 -->
    <div class="flex justify-center flex-wrap gap-2 mb-8" id="filter-buttons">
      <button onclick="filterStores('all', this)" class="filter-btn bg-emerald-500 text-white font-medium px-5 py-1.5 rounded-full shadow-sm hover:bg-emerald-600 transition">全部 (58)</button>
      <button onclick="filterStores('北部', this)" class="filter-btn bg-gray-200 text-gray-700 font-medium px-5 py-1.5 rounded-full hover:bg-gray-300 transition">北部 (17)</button>
      <button onclick="filterStores('中部', this)" class="filter-btn bg-gray-200 text-gray-700 font-medium px-5 py-1.5 rounded-full hover:bg-gray-300 transition">中部 (18)</button>
      <button onclick="filterStores('南部', this)" class="filter-btn bg-gray-200 text-gray-700 font-medium px-5 py-1.5 rounded-full hover:bg-gray-300 transition">南部 (21)</button>
      <button onclick="filterStores('東部', this)" class="filter-btn bg-gray-200 text-gray-700 font-medium px-5 py-1.5 rounded-full hover:bg-gray-300 transition">東部 (2)</button>
    </div>

    <!-- 門市列表卡片網格 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="store-grid">
      <!-- JS 渲染門市資料 -->
    </div>
  </div>

      { region: "南部", name: "Funbox 台南新光西門", lineId: "333ttyuu" },
      { region: "南部", name: "Funbox 台南新光中山", lineId: "444iioop" },

      // 東部 (2)
      { region: "東部", name: "Funbox 宜蘭新月廣場", lineId: "201iioop" },
      { region: "東部", name: "Funbox 花蓮遠東", lineId: "202paass" }
    ];

    let clickedStores = JSON.parse(localStorage.getItem('clickedStores') || '{}');

    function renderStores(filter = 'all') {
      const grid = document.getElementById('store-grid');
      grid.innerHTML = '';

      const filtered = stores.filter(s => filter === 'all' || s.region === filter);

      filtered.forEach((store) => {
        const isClicked = clickedStores[store.lineId];
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl p-4 shadow-sm flex items-center justify-between border border-gray-100 hover:shadow-md transition";
        
        const lineUrl = `https://line.me/R/ti/p/%40${store.lineId}`;

        card.innerHTML = `
          <div>
            <span class="text-xs text-gray-400 font-medium">${store.region}</span>
            <div class="flex items-center gap-1.5 mt-0.5">
              <h3 class="font-bold text-gray-800 text-base">${store.name}</h3>
              ${store.isNew ? '<span class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">NEW</span>' : ''}
            </div>
            <p class="text-xs text-gray-400 mt-1">@${store.lineId}</p>
          </div>
          <a href="${lineUrl}" target="_blank" onclick="markAsClicked('${store.lineId}', this)" 
             class="btn-add font-medium text-sm px-4 py-2 rounded-lg transition-colors flex items-center gap-1 ${
               isClicked 
               ? 'bg-gray-200 text-gray-500 hover:bg-gray-300' 
               : 'bg-emerald-500 hover:bg-emerald-600 text-white'
             }">
            <span>${isClicked ? '✓ 已加入' : '+ 加好友'}</span>
          </a>
        `;
        grid.appendChild(card);
      });
    }

    function markAsClicked(lineId, el) {
      clickedStores[lineId] = true;
      localStorage.setItem('clickedStores', JSON.stringify(clickedStores));
      el.className = "btn-add font-medium text-sm px-4 py-2 rounded-lg transition-colors flex items-center gap-1 bg-gray-200 text-gray-500 hover:bg-gray-300";
      el.innerHTML = "<span>✓ 已加入</span>";
    }

    function filterStores(region, btnEl) {
      const buttons = document.querySelectorAll('#filter-buttons button');
      buttons.forEach(btn => {
        btn.className = "filter-btn bg-gray-200 text-gray-700 font-medium px-5 py-1.5 rounded-full hover:bg-gray-300 transition";
      });
      btnEl.className = "filter-btn bg-emerald-500 text-white font-medium px-5 py-1.5 rounded-full shadow-sm hover:bg-emerald-600 transition";

      renderStores(region);
    }

    // 初次載入
    renderStores();
  </script>
</body>
</html>
